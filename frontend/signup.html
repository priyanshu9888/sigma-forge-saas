<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FigmaForge — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Spline+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #0b0f14;
      --white: #eef4f8;
      --cream: #d9e2ea;
      --amber: #3ee6c7;
      --amber-d: #1db9a2;
      --slate: #0f1622;
      --muted: #95a3b3;
      --border: rgba(62,230,199,0.18);
      --ff-display: 'Space Grotesk', sans-serif;
      --ff-mono: 'JetBrains Mono', monospace;
      --ff-body: 'Spline Sans', sans-serif;
      --radius: 12px;
    }
    body {
      background:
        radial-gradient(900px 520px at 85% -10%, rgba(62,230,199,0.18), transparent 60%),
        radial-gradient(700px 420px at 10% 10%, rgba(255,179,71,0.12), transparent 55%),
        var(--black);
      color: var(--white);
      font-family: var(--ff-body);
      line-height: 1.6;
      min-height: 100vh;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.035'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0; opacity: 0.4;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 48px;
      border-bottom: 1px solid var(--border);
      background: rgba(11,15,20,0.82);
      backdrop-filter: blur(18px);
    }
    .nav-logo {
      font-family: var(--ff-display);
      font-size: 1.15rem; font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--white);
      text-decoration: none;
      display: flex; align-items: center; gap: 10px;
    }
    .nav-logo span {
      display: inline-flex; width: 28px; height: 28px;
      background: var(--amber);
      border-radius: 8px; align-items: center; justify-content: center;
      color: #041014; font-weight: 700; font-size: 14px;
    }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a {
      color: var(--muted); text-decoration: none;
      font-size: 0.9rem; font-weight: 500;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-cta {
      background: var(--amber); color: #041014 !important;
      padding: 9px 18px; border-radius: 10px;
      font-weight: 700 !important; font-size: 0.85rem !important;
      transition: transform 0.15s, background 0.2s;
    }
    .nav-cta:hover { background: var(--amber-d); transform: translateY(-1px); }
    .container {
      max-width: 520px; margin: 0 auto;
      padding: 140px 24px 80px; position: relative; z-index: 1;
    }
    h1 {
      font-family: var(--ff-display);
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      line-height: 1.1; margin-bottom: 10px;
      letter-spacing: -0.03em;
    }
    .sub { color: var(--muted); margin-bottom: 24px; }
    .card {
      background: rgba(15,22,34,0.9);
      border: 1px solid var(--border);
      border-radius: 18px; padding: 26px;
      display: grid; gap: 14px;
    }
    .field { display: grid; gap: 8px; min-width: 0; }
    .label { font-family: var(--ff-mono); font-size: 0.7rem; color: var(--muted); letter-spacing: 0.08em; }
    .input {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      padding: 10px 14px; color: var(--white); font-family: var(--ff-mono); font-size: 0.85rem;
      width: 100%;
    }
    .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .btn {
      background: var(--amber); color: #041014; border: none; border-radius: 10px; padding: 12px 16px;
      font-family: var(--ff-display); font-weight: 700; cursor: pointer; font-size: 0.9rem;
      transition: transform 0.15s, background 0.2s;
    }
    .btn:hover { background: var(--amber-d); transform: translateY(-1px); }
    .btn-ghost {
      background: transparent; color: var(--white); border: 1px solid rgba(255,255,255,0.2);
    }
    .note { color: var(--muted); font-size: 0.85rem; }
    .message { font-size: 0.85rem; min-height: 20px; }
    @media (max-width: 720px) {
      nav { padding: 16px 20px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="index.html"><span>⌘</span>FigmaForge</a>
    <div class="nav-links">
      <a href="docs.html">Docs</a>
      <a href="pricing.html">Pricing</a>
      <a href="#" data-auth-action="login" data-auth-show="signed-out">Sign in</a>
      <a href="#" data-auth-action="logout" data-auth-show="signed-in" style="display:none">Sign out</a>
      <a href="dashboard.html" class="nav-cta">Dashboard</a>
    </div>
  </nav>

  <main class="container">
    <h1>Create your account</h1>
    <p class="sub">Add your details and start generating production-ready code from Figma.</p>

    <form class="card" id="signupForm">
      <div class="row">
        <div class="field">
          <div class="label">FULL NAME</div>
          <input class="input" id="fullName" placeholder="Jane Doe" required />
        </div>
        <div class="field">
          <div class="label">COMPANY</div>
          <input class="input" id="company" placeholder="Acme Studio" required />
        </div>
      </div>
      <div class="field">
        <div class="label">EMAIL</div>
        <input class="input" id="email" type="email" placeholder="you@company.com" required />
      </div>
      <div class="field">
        <div class="label">PASSWORD</div>
        <input class="input" id="password" type="password" placeholder="••••••••" required />
      </div>
      <div class="note" id="localeNote">We will personalize your pricing based on your location.</div>
      <div class="message" id="signupMessage"></div>
      <button class="btn" type="submit">Create account</button>
      <button class="btn btn-ghost" type="button" id="openLogin">Already have an account? Sign in</button>
    </form>
  </main>

  <script src="config.js"></script>
  <script src="currency.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById('signupForm');
    const message = document.getElementById('signupMessage');
    const localeNote = document.getElementById('localeNote');

    const currencyInfo = window.FF_CURRENCY ? window.FF_CURRENCY.resolveCurrency() : null;
    if (currencyInfo) {
      localeNote.textContent = `Detected ${currencyInfo.country}. Prices will display in ${currencyInfo.currency}.`;
    }

    function setMessage(text, isError) {
      message.textContent = text || '';
      message.style.color = isError ? '#ff5c7a' : '#95a3b3';
    }

    document.getElementById('openLogin').addEventListener('click', () => {
      if (window.FF_AUTH && window.FF_AUTH.openAuthModal) {
        window.FF_AUTH.openAuthModal();
      } else {
        window.location = 'index.html';
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      setMessage('Creating your account...');

      if (!window.FF_AUTH) {
        setMessage('Supabase is not configured yet.', true);
        return;
      }

      const fullName = document.getElementById('fullName').value.trim();
      const company = document.getElementById('company').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!fullName || !company || !email || !password) {
        setMessage('All fields are required.', true);
        return;
      }

      const details = {
        fullName,
        company,
        email,
        password,
        country: currencyInfo ? currencyInfo.country : '',
        currency: currencyInfo ? currencyInfo.currency : '',
      };

      const { data, error } = await window.FF_AUTH.signUpWithDetails(details);
      if (error) {
        setMessage(error.message || 'Sign up failed.', true);
        return;
      }

      if (data && data.session) {
        setMessage('Account created. Redirecting to dashboard...');
        window.location = 'dashboard.html';
        return;
      }

      setMessage('Check your email to confirm your account.', false);
      form.reset();
    });
  </script>
</body>
</html>
